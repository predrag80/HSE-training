server {
	listen 443 ssl;
	listen [::]:443 ssl ipv6only=on;
	server_name staging.hsetraining.rs;

	ssl_certificate /etc/letsencrypt/live/staging.hsetraining.rs/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/staging.hsetraining.rs/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	root /var/www/hsetraining-staging/current;
	index index.html;

	access_log /var/log/nginx/hsetraining-staging.access.log;
	error_log /var/log/nginx/hsetraining-staging.error.log;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-Robots-Tag "noindex, nofollow" always;

	location / {
		try_files $uri $uri/ =404;
	}

	location ~* \.(?:css|gif|ico|jpe?g|js|mjs|png|svg|webp|woff2?)$ {
		expires 7d;
		add_header Cache-Control "public, max-age=604800";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header X-Robots-Tag "noindex, nofollow" always;
		try_files $uri =404;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name staging.hsetraining.rs;

	return 301 https://$host$request_uri;
}
