name: Decommission dev environment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsetraining-dev-decommission
  cancel-in-progress: false

jobs:
  decommission:
    name: Remove isolated dev environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      SSH_HOST: s83.unlimited.rs
      SSH_PORT: "9780"
      SSH_USER: sbb22122
      CPANEL_HOST: s83.unlimited.rs
      DEV_FRONTEND_ROOT: /home/sbb22122/dev.hsetraining.rs
      DEV_CMS_ROOT: /home/sbb22122/dev-cms.hsetraining.rs
      DEV_FRONTEND_DOMAIN: dev.hsetraining.rs
      DEV_CMS_DOMAIN: dev-cms.hsetraining.rs
      STAGING_CMS_ROOT: /home/sbb22122/staging-cms.hsetraining.rs
      PRODUCTION_CMS_ROOT: /home/sbb22122/cms.hsetraining.rs

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Unlimited SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.UNLIMITED_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.UNLIMITED_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/unlimited_deploy"
          chmod 600 "$HOME/.ssh/unlimited_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Decommission dev environment
        run: |
          set -euo pipefail
          ssh_target="${SSH_USER}@${SSH_HOST}"
          ssh_options=(-i "$HOME/.ssh/unlimited_deploy" -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp_options=(-i "$HOME/.ssh/unlimited_deploy" -P "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          remote_script="/home/${SSH_USER}/.hse-dev-decommission-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"

          scp "${scp_options[@]}" scripts/decommission-dev-environment.sh "$ssh_target:$remote_script"
          ssh "${ssh_options[@]}" "$ssh_target" \
            "chmod 700 '$remote_script' && '$remote_script' '$SSH_USER' '$DEV_FRONTEND_ROOT' '$DEV_CMS_ROOT' '$DEV_FRONTEND_DOMAIN' '$DEV_CMS_DOMAIN' '$STAGING_CMS_ROOT' '$PRODUCTION_CMS_ROOT' '$CPANEL_HOST'; status=\$?; rm -f '$remote_script'; exit \$status"

      - name: Remove deployment key
        if: always()
        run: rm -f "$HOME/.ssh/unlimited_deploy"
