name: Configure production CMS Turnstile

on:
  workflow_dispatch:
    inputs:
      required:
        description: Require a valid Turnstile token for every contact submission
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  configure:
    name: Configure production Turnstile secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      SSH_HOST: s83.unlimited.rs
      SSH_PORT: "9780"
      SSH_USER: sbb22122
      WORDPRESS_ROOT: /home/sbb22122/cms.hsetraining.rs
      PRIVATE_CONFIG: /home/sbb22122/.hse-turnstile.php
      TURNSTILE_REQUIRED: ${{ inputs.required }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Unlimited SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.UNLIMITED_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.UNLIMITED_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/unlimited_deploy"
          chmod 600 "$HOME/.ssh/unlimited_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare private Turnstile configuration
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.HSE_TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$TURNSTILE_SECRET_KEY"
          case "$TURNSTILE_REQUIRED" in
            true|false) ;;
            *) echo "Invalid Turnstile enforcement value." >&2; exit 1 ;;
          esac
          export TURNSTILE_SECRET_KEY
          export TURNSTILE_REQUIRED
          export OUTPUT_PATH="$RUNNER_TEMP/hse-turnstile.php"
          php -r '
            $secret = getenv("TURNSTILE_SECRET_KEY");
            $required = getenv("TURNSTILE_REQUIRED") === "true";
            $path = getenv("OUTPUT_PATH");
            $contents = "<?php\n\n";
            $contents .= "define( \"HSE_TURNSTILE_SECRET_KEY\", " . var_export($secret, true) . " );\n";
            $contents .= "define( \"HSE_TURNSTILE_ALLOWED_HOSTNAMES\", \"hsetraining.rs,www.hsetraining.rs\" );\n";
            $contents .= "define( \"HSE_TURNSTILE_ACTION\", \"contact\" );\n";
            $contents .= "define( \"HSE_TURNSTILE_REQUIRED\", " . var_export($required, true) . " );\n";
            if (file_put_contents($path, $contents, LOCK_EX) === false) {
                fwrite(STDERR, "Unable to prepare the private Turnstile configuration.\n");
                exit(1);
            }
          '
          chmod 600 "$OUTPUT_PATH"

      - name: Install private configuration on production CMS
        run: |
          set -euo pipefail
          ssh_target="${SSH_USER}@${SSH_HOST}"
          ssh_options=(-i "$HOME/.ssh/unlimited_deploy" -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          scp_options=(-i "$HOME/.ssh/unlimited_deploy" -P "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          scp "${scp_options[@]}" "$RUNNER_TEMP/hse-turnstile.php" "$ssh_target:${PRIVATE_CONFIG}.next"
          scp "${scp_options[@]}" scripts/configure-hse-turnstile.php "$ssh_target:/home/${SSH_USER}/.configure-hse-turnstile.php"

          ssh "${ssh_options[@]}" "$ssh_target" \
            "set -eu; chmod 600 '${PRIVATE_CONFIG}.next'; mv '${PRIVATE_CONFIG}.next' '${PRIVATE_CONFIG}'; php '/home/${SSH_USER}/.configure-hse-turnstile.php' '${WORDPRESS_ROOT}/wp-config.php' '${PRIVATE_CONFIG}'; php -l '${WORDPRESS_ROOT}/wp-config.php'; php -r 'require \"${PRIVATE_CONFIG}\"; exit(defined(\"HSE_TURNSTILE_SECRET_KEY\") && HSE_TURNSTILE_SECRET_KEY !== \"\" && defined(\"HSE_TURNSTILE_ALLOWED_HOSTNAMES\") && HSE_TURNSTILE_ALLOWED_HOSTNAMES === \"hsetraining.rs,www.hsetraining.rs\" && defined(\"HSE_TURNSTILE_ACTION\") && HSE_TURNSTILE_ACTION === \"contact\" && defined(\"HSE_TURNSTILE_REQUIRED\") && HSE_TURNSTILE_REQUIRED === ${TURNSTILE_REQUIRED} ? 0 : 1);'; rm '/home/${SSH_USER}/.configure-hse-turnstile.php'"

      - name: Remove deployment key and local private configuration
        if: always()
        run: |
          rm -f "$HOME/.ssh/unlimited_deploy"
          rm -f "$RUNNER_TEMP/hse-turnstile.php"
