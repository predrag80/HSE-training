name: Deploy Astro to staging (Unlimited)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-staging.yml
      - .node-version
      - apps/web/**
      - scripts/deploy-astro-unlimited.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hsetraining-staging-unlimited
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.hsetraining.rs
    env:
      DEPLOY_ENVIRONMENT: staging
      DEPLOY_ROOT: /home/sbb22122/staging.hsetraining.rs
      DEPLOY_URL: https://staging.hsetraining.rs
      WORDPRESS_API_URL: https://cms.hsetraining.rs
      HSE_CHECKOUT_SOURCE: staging
      SSH_HOST: s83.unlimited.rs
      SSH_PORT: "9780"
      SSH_USER: sbb22122
      DEPLOY_HTTP_AUTH_USER: ${{ secrets.UNLIMITED_HTTP_AUTH_USER }}
      DEPLOY_HTTP_AUTH_PASSWORD: ${{ secrets.UNLIMITED_HTTP_AUTH_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Run tests
        run: npm run test
        working-directory: apps/web

      - name: Check Astro and TypeScript
        run: npm run check
        working-directory: apps/web

      - name: Lint application
        run: npm run lint
        working-directory: apps/web

      - name: Build static site
        run: npm run build
        working-directory: apps/web

      - name: Configure Unlimited SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.UNLIMITED_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.UNLIMITED_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/unlimited_deploy"
          chmod 600 "$HOME/.ssh/unlimited_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy and verify
        run: |
          export SSH_PRIVATE_KEY_PATH="$HOME/.ssh/unlimited_deploy"
          bash scripts/deploy-astro-unlimited.sh

      - name: Remove deployment key
        if: always()
        run: rm -f "$HOME/.ssh/unlimited_deploy"
